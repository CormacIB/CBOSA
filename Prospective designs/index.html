<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CBOSA — Personal OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=VT323&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<script>
  // Persisted defaults — edited by host when user toggles tweaks
  window.__TWEAK_DEFAULTS__ = /*EDITMODE-BEGIN*/{
    "theme": "phosphor",
    "fontFamily": "JetBrains Mono",
    "fontSize": 13,
    "scanlines": true,
    "crtGlow": true,
    "asciiHeader": true,
    "dither": false,
    "artSlots": true,
    "density": "compact",
    "asciiArt": "orbital"
  }/*EDITMODE-END*/;
</script>

<style>
  :root {
    /* Phosphor Green (default) */
    --bg: #000000;
    --bg-1: #050a06;
    --bg-2: #0a140c;
    --fg: #33ff66;
    --fg-dim: #1a8033;
    --fg-mute: #0e4d1d;
    --accent: #ffb000;
    --accent-dim: #805800;
    --rule: #1a3a22;
    --sel: rgba(51, 255, 102, 0.14);
    --hot: #ff4d4d;
    --glow: 0 0 6px rgba(51, 255, 102, 0.45);
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  * { box-sizing: border-box; }

  /* App shell */
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* CRT glow on text */
  body.crt-glow, body.crt-glow * {
    text-shadow: 0 0 1px currentColor, 0 0 8px rgba(51,255,102,0.20);
  }
  body.crt-glow.theme-amber, body.crt-glow.theme-amber * {
    text-shadow: 0 0 1px currentColor, 0 0 8px rgba(255,176,0,0.22);
  }
  body.crt-glow.theme-blue, body.crt-glow.theme-blue * {
    text-shadow: 0 0 1px currentColor, 0 0 8px rgba(107,193,255,0.22);
  }
  body.crt-glow.theme-paper, body.crt-glow.theme-paper * {
    text-shadow: none;
  }

  /* Scanlines overlay */
  body.scanlines::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9000;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.22) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: multiply;
  }
  body.scanlines::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9001;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%);
  }
  body.theme-paper.scanlines::before { opacity: 0.35; }
  body.theme-paper.scanlines::after { opacity: 0.25; }

  /* Dither pattern */
  body.dither #app {
    background-image:
      radial-gradient(rgba(51,255,102,0.05) 1px, transparent 1px),
      radial-gradient(rgba(51,255,102,0.03) 1px, transparent 1px);
    background-size: 4px 4px, 8px 8px;
    background-position: 0 0, 2px 2px;
  }
  body.theme-amber.dither #app {
    background-image:
      radial-gradient(rgba(255,176,0,0.06) 1px, transparent 1px),
      radial-gradient(rgba(255,176,0,0.03) 1px, transparent 1px);
  }
  body.theme-blue.dither #app {
    background-image:
      radial-gradient(rgba(107,193,255,0.06) 1px, transparent 1px),
      radial-gradient(rgba(107,193,255,0.03) 1px, transparent 1px);
  }
  body.theme-paper.dither #app {
    background-image:
      radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
  }

  /* Themes */
  body.theme-phosphor {
    --bg: #000000;
    --bg-1: #050a06;
    --bg-2: #0a140c;
    --fg: #33ff66;
    --fg-dim: #1a8033;
    --fg-mute: #0e4d1d;
    --accent: #ffb000;
    --accent-dim: #805800;
    --rule: #1a3a22;
    --sel: rgba(51, 255, 102, 0.14);
  }
  body.theme-amber {
    --bg: #0a0500;
    --bg-1: #100800;
    --bg-2: #1a0e00;
    --fg: #ffb000;
    --fg-dim: #805800;
    --fg-mute: #3d2900;
    --accent: #ff5500;
    --accent-dim: #802b00;
    --rule: #3d2900;
    --sel: rgba(255,176,0,0.14);
  }
  body.theme-blue {
    --bg: #00131f;
    --bg-1: #001a2b;
    --bg-2: #002238;
    --fg: #6bc1ff;
    --fg-dim: #3a7ab3;
    --fg-mute: #1f4566;
    --accent: #ffffff;
    --accent-dim: #b3b3b3;
    --rule: #1f4566;
    --sel: rgba(107,193,255,0.14);
  }
  body.theme-paper {
    --bg: #f5f1e8;
    --bg-1: #efeadc;
    --bg-2: #e8e2d2;
    --fg: #1a1a1a;
    --fg-dim: #555;
    --fg-mute: #8a8a8a;
    --accent: #b3361b;
    --accent-dim: #8a2614;
    --rule: #c8c2b3;
    --sel: rgba(179,54,27,0.10);
  }

  /* — Karpathy Paper Wiki — academic, off-white, blue links */
  body.theme-karpathy {
    --bg: #fdfaf0;
    --bg-1: #f6f1de;
    --bg-2: #ede5c8;
    --fg: #1a1a1a;
    --fg-dim: #4a4a4a;
    --fg-mute: #888;
    --accent: #0033cc;
    --accent-dim: #002388;
    --rule: #d8cfa8;
    --sel: rgba(0,51,204,0.10);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  body.theme-karpathy { font-family: "IBM Plex Mono", ui-monospace, monospace !important; }
  body.theme-karpathy .editor h1,
  body.theme-karpathy .editor h2,
  body.theme-karpathy .editor h3 {
    font-family: "Lora", Georgia, serif;
    font-weight: 600;
    color: #1a1a1a;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 4px;
  }
  body.theme-karpathy .editor h1::before,
  body.theme-karpathy .editor h2::before,
  body.theme-karpathy .editor h3::before { content: none; }
  body.theme-karpathy .ascii-header { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0; font-style: normal; color: var(--accent); }
  body.theme-karpathy .wikilink { text-decoration-style: solid; }
  body.theme-karpathy .panel-head { background: var(--bg-1); }
  body.theme-karpathy .winchrome { background: var(--bg-1); }
  body.theme-karpathy .editor { font-size: 14px; }

  /* — Obsidian Dark — soft purples + blues, rounded */
  body.theme-obsidian {
    --bg: #1e1e2e;
    --bg-1: #232336;
    --bg-2: #2a2a40;
    --fg: #cdd6f4;
    --fg-dim: #8b91b0;
    --fg-mute: #585b70;
    --accent: #cba6f7;
    --accent-dim: #7a5fb8;
    --rule: #383850;
    --sel: rgba(203,166,247,0.14);
    font-family: "Inter", system-ui, sans-serif;
  }
  body.theme-obsidian { font-family: "Inter", system-ui, sans-serif !important; }
  body.theme-obsidian .editor h1,
  body.theme-obsidian .editor h2,
  body.theme-obsidian .editor h3 {
    color: var(--accent);
    font-weight: 600;
  }
  body.theme-obsidian .editor h1::before { content: "# "; color: #89b4fa; }
  body.theme-obsidian .editor h2::before { content: "## "; color: #89b4fa; }
  body.theme-obsidian .editor h3::before { content: "### "; color: #89b4fa; }
  body.theme-obsidian .panel,
  body.theme-obsidian .panel-head { background: var(--bg-1); }
  body.theme-obsidian .input,
  body.theme-obsidian .chip { border-radius: 6px; }
  body.theme-obsidian .winbtn { border-radius: 50%; }
  body.theme-obsidian .ascii-header { font-family: "JetBrains Mono", monospace; color: #89b4fa; }
  body.theme-obsidian .editor code { background: var(--bg-2); border-radius: 4px; font-family: "JetBrains Mono", monospace; }
  body.theme-obsidian .wikilink { color: #89b4fa; text-decoration-style: solid; }
  body.theme-obsidian .editor { font-size: 14px; line-height: 1.6; }
  body.theme-obsidian .frontmatter { border-radius: 6px; font-family: "JetBrains Mono", monospace; font-size: 12px; }

  /* — Brutalist Swiss — pure white, hard borders, big numbers, Helvetica */
  body.theme-swiss {
    --bg: #ffffff;
    --bg-1: #f4f4f4;
    --bg-2: #e8e8e8;
    --fg: #000000;
    --fg-dim: #333;
    --fg-mute: #888;
    --accent: #ff0033;
    --accent-dim: #cc0022;
    --rule: #000000;
    --sel: rgba(255,0,51,0.10);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body.theme-swiss { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif !important; }
  body.theme-swiss .winchrome,
  body.theme-swiss .menubar,
  body.theme-swiss .panel-head,
  body.theme-swiss .panel,
  body.theme-swiss .statusbar,
  body.theme-swiss .editor-bar { border-color: #000 !important; }
  body.theme-swiss .panel-head { border-bottom-width: 2px; background: var(--bg); text-transform: uppercase; font-weight: 700; }
  body.theme-swiss .winchrome { border-bottom-width: 2px; }
  body.theme-swiss .statusbar { border-top-width: 2px; }
  body.theme-swiss .menubar { border-bottom-width: 2px; }
  body.theme-swiss .editor-bar { border-bottom-width: 2px; }
  body.theme-swiss .workspace > .panel { border-right-width: 2px; }
  body.theme-swiss .stack > .panel + .panel { border-top-width: 2px; }
  body.theme-swiss .editor h1,
  body.theme-swiss .editor h2,
  body.theme-swiss .editor h3 {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #000;
  }
  body.theme-swiss .editor h1 { font-size: 2.2em; line-height: 1.0; margin: 22px 0 12px; }
  body.theme-swiss .editor h1::before,
  body.theme-swiss .editor h2::before,
  body.theme-swiss .editor h3::before { content: none; }
  body.theme-swiss .ascii-header { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.04em; text-align: left; padding-left: 8px; }
  body.theme-swiss .chip { border-radius: 0; border-width: 1.5px; }
  body.theme-swiss .input { border-radius: 0; border-width: 1.5px; }
  body.theme-swiss .winbtn { border-radius: 0; border-width: 1.5px; }
  body.theme-swiss .wikilink { color: var(--accent); text-decoration-style: solid; }
  body.theme-swiss .bar-fill { box-shadow: none; }
  body.theme-swiss .editor { font-size: 14px; }
  body.theme-swiss .editor code { background: #f4f4f4; border-radius: 0; border-color: #000; }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--fg-mute); }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }

  ::selection { background: var(--sel); color: var(--accent); }

  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { color: var(--fg); }

  hr.row { border: none; border-top: 1px dashed var(--rule); margin: 6px 0; }

  /* Density */
  body.density-compact { font-size: 12px; line-height: 1.35; }
  body.density-comfy  { font-size: 14px; line-height: 1.55; }

  /* Generic utility classes */
  .dim { color: var(--fg-dim); }
  .mute { color: var(--fg-mute); }
  .acc { color: var(--accent); }
  .hot { color: var(--hot); }
  .nowrap { white-space: nowrap; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .gap-1 { gap: 4px; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .grow { flex: 1; min-width: 0; min-height: 0; }

  /* Window chrome (app frame mocked as Qt-ish) */
  .winchrome {
    height: 32px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 8px;
    background: var(--bg-1);
    flex: 0 0 32px;
    font-size: 12px;
  }
  .winbtns { display: flex; gap: 6px; padding-right: 4px; }
  .winbtn {
    width: 12px; height: 12px;
    border: 1px solid var(--fg-dim);
    border-radius: 0;
    display: inline-block;
  }
  .winbtn.x { border-color: var(--hot); }
  .wintitle { color: var(--fg-dim); letter-spacing: 0.05em; }
  .wintitle b { color: var(--fg); font-weight: 600; }

  .menubar {
    height: 26px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    display: flex;
    align-items: center;
    padding: 0 6px;
    gap: 2px;
    flex: 0 0 26px;
    font-size: 12px;
  }
  .menu {
    padding: 2px 8px;
    cursor: default;
    color: var(--fg-dim);
  }
  .menu:hover { color: var(--fg); background: var(--sel); }
  .menu.active { color: var(--fg); background: var(--sel); }

  .menubar .right {
    margin-left: auto;
    display: flex;
    gap: 12px;
    color: var(--fg-dim);
    padding-right: 6px;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .menubar .right b { color: var(--accent); font-weight: 500; }

  /* Workspace grid */
  .workspace {
    display: grid;
    grid-template-columns: 280px 1fr 340px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .workspace.density-compact { grid-template-columns: 240px 1fr 300px; }

  /* Panel chrome (box-drawing characters via CSS) */
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--rule);
    background: var(--bg);
  }
  .panel:last-child { border-right: none; }
  .panel.stack { border-right: 1px solid var(--rule); }
  .panel-head {
    display: flex;
    align-items: center;
    height: 24px;
    flex: 0 0 24px;
    padding: 0 8px;
    border-bottom: 1px solid var(--rule);
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--bg-1);
    user-select: none;
  }
  .panel-head .tab {
    margin-right: 12px;
    color: var(--fg-dim);
    cursor: default;
    padding: 0 0 0 0;
    position: relative;
  }
  .panel-head .tab.active {
    color: var(--fg);
  }
  .panel-head .tab.active::before {
    content: "▌";
    color: var(--accent);
    margin-right: 4px;
  }
  .panel-head .glyph {
    color: var(--accent);
    margin-right: 6px;
  }
  .panel-head .ctrl {
    margin-left: auto;
    display: flex;
    gap: 4px;
    color: var(--fg-dim);
  }
  .panel-head .ctrl span {
    padding: 0 4px;
    cursor: default;
  }
  .panel-head .ctrl span:hover { color: var(--fg); background: var(--sel); }

  .panel-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 6px 8px;
  }

  /* Right column splits */
  .stack { display: flex; flex-direction: column; min-height: 0; }
  .stack > .panel + .panel { border-top: 1px solid var(--rule); }

  /* Status bar */
  .statusbar {
    height: 22px;
    flex: 0 0 22px;
    border-top: 1px solid var(--rule);
    background: var(--bg-1);
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-size: 11px;
    color: var(--fg-dim);
    gap: 16px;
    letter-spacing: 0.04em;
  }
  .statusbar .sep { color: var(--fg-mute); }
  .statusbar .right { margin-left: auto; display: flex; gap: 14px; }
  .statusbar b { color: var(--fg); font-weight: 500; }
  .statusbar .acc { color: var(--accent); }

  /* Tree (note browser) */
  .tree { font-size: inherit; line-height: 1.55; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
    cursor: default;
    white-space: nowrap;
    color: var(--fg);
  }
  .tree-row:hover { background: var(--sel); }
  .tree-row.active { background: var(--sel); color: var(--accent); }
  .tree-row .glyph { color: var(--fg-dim); width: 14px; display: inline-block; text-align: center; }
  .tree-row.folder > .glyph { color: var(--accent); }
  .tree-row .name { overflow: hidden; text-overflow: ellipsis; }
  .tree-indent { display: inline-block; width: 14px; }

  /* Form / inputs */
  .input {
    width: 100%;
    background: var(--bg-1);
    border: 1px solid var(--rule);
    color: var(--fg);
    font: inherit;
    padding: 3px 6px;
    outline: none;
  }
  .input:focus { border-color: var(--fg-dim); background: var(--bg-2); }
  .input::placeholder { color: var(--fg-mute); }

  .chip {
    display: inline-block;
    padding: 0 6px;
    border: 1px solid var(--rule);
    color: var(--fg-dim);
    margin: 2px 4px 2px 0;
    cursor: default;
    font-size: 11px;
    user-select: none;
  }
  .chip:hover { color: var(--fg); border-color: var(--fg-dim); }
  .chip.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--sel);
  }
  .chip .ct { color: var(--fg-mute); margin-left: 4px; }

  /* Editor */
  .editor {
    padding: 14px 32px;
    max-width: 900px;
    margin: 0 auto;
    color: var(--fg);
    font-size: inherit;
  }
  .editor h1, .editor h2, .editor h3 {
    color: var(--fg);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 18px 0 8px;
    font-family: inherit;
  }
  .editor h1 { font-size: 1.5em; }
  .editor h1::before {
    content: "# ";
    color: var(--accent);
  }
  .editor h2 { font-size: 1.2em; }
  .editor h2::before {
    content: "## ";
    color: var(--accent);
  }
  .editor h3 { font-size: 1.05em; }
  .editor h3::before {
    content: "### ";
    color: var(--accent);
  }
  .editor p { margin: 8px 0; }
  .editor ul { margin: 6px 0; padding-left: 22px; }
  .editor li { margin: 3px 0; }
  .editor ul li::marker { color: var(--accent); content: "› "; }
  .editor code {
    background: var(--bg-1);
    border: 1px solid var(--rule);
    padding: 0 4px;
    color: var(--accent);
  }
  .editor blockquote {
    margin: 8px 0;
    padding: 4px 0 4px 12px;
    border-left: 2px solid var(--accent);
    color: var(--fg-dim);
  }
  .wikilink {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    text-decoration-style: dashed;
  }
  .wikilink:hover { color: var(--fg); background: var(--sel); }
  .wikilink.broken { color: var(--hot); text-decoration-style: dotted; }
  .frontmatter {
    color: var(--fg-dim);
    border: 1px dashed var(--rule);
    padding: 6px 10px;
    margin-bottom: 12px;
    font-size: 0.95em;
    background: var(--bg-1);
  }
  .frontmatter .k { color: var(--accent); }
  .frontmatter .delim {
    color: var(--fg-mute);
    display: block;
    margin: -2px 0 4px;
  }

  /* Editor toolbar */
  .editor-bar {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--rule);
    height: 28px;
    flex: 0 0 28px;
    padding: 0 12px;
    gap: 12px;
    font-size: 11px;
    color: var(--fg-dim);
    background: var(--bg);
  }
  .editor-bar .crumb { color: var(--fg-dim); }
  .editor-bar .crumb b { color: var(--fg); font-weight: 500; }
  .editor-bar .crumb .sep { color: var(--fg-mute); margin: 0 6px; }
  .editor-bar .right { margin-left: auto; display: flex; gap: 12px; }
  .editor-bar .tog { color: var(--fg-dim); cursor: default; }
  .editor-bar .tog.on { color: var(--accent); }
  .editor-bar .tog:hover { color: var(--fg); }

  /* Tasks */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 2px 0;
    cursor: default;
  }
  .task:hover { background: var(--sel); }
  .task .box { color: var(--fg-dim); width: 16px; flex-shrink: 0; }
  .task.done .box { color: var(--accent); }
  .task.done .label { color: var(--fg-dim); text-decoration: line-through; }
  .task .meta { margin-left: auto; color: var(--fg-mute); font-size: 11px; padding-left: 8px; }
  .task .tag { color: var(--accent); }

  /* Email list */
  .mail {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--rule);
    cursor: default;
    align-items: baseline;
  }
  .mail:hover { background: var(--sel); }
  .mail .from { color: var(--fg); }
  .mail .subj { color: var(--fg-dim); font-size: 11px; }
  .mail .when { color: var(--fg-mute); font-size: 11px; }
  .mail .pip { color: var(--accent); }
  .mail.read .from { color: var(--fg-dim); }
  .mail.read .pip { color: transparent; }
  .mail .action {
    grid-column: 2 / 4;
    color: var(--accent);
    font-size: 11px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mail .action::before {
    content: "↳ TASK:";
    color: var(--fg-mute);
    font-size: 10px;
    letter-spacing: 0.08em;
  }

  /* Bar chart for finance */
  .barchart { display: flex; flex-direction: column; gap: 3px; margin: 4px 0; }
  .bar-row { display: grid; grid-template-columns: 64px 1fr 56px; gap: 8px; align-items: center; font-size: 11px; }
  .bar-row .cat { color: var(--fg-dim); }
  .bar-row .amt { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }
  .bar-track {
    background: var(--bg-1);
    border: 1px solid var(--rule);
    height: 10px;
    position: relative;
  }
  .bar-fill {
    background: var(--accent);
    height: 100%;
    box-shadow: var(--glow);
  }
  body.theme-paper .bar-fill { box-shadow: none; }

  /* ASCII sparkline */
  .spark {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: -1px;
    white-space: nowrap;
  }

  /* Art slots */
  .artslot {
    border: 1px dashed var(--fg-mute);
    background:
      repeating-linear-gradient(
        45deg,
        transparent 0 6px,
        var(--bg-1) 6px 7px
      );
    padding: 18px 12px;
    text-align: center;
    color: var(--fg-mute);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 8px 0;
    cursor: default;
  }
  .artslot:hover { color: var(--fg-dim); border-color: var(--fg-dim); }

  /* ASCII header */
  .ascii-header {
    color: var(--accent);
    white-space: pre;
    line-height: 1.0;
    font-size: 10px;
    margin: 4px 0 8px;
    text-align: center;
    user-select: none;
  }
  .ascii-header.dim { color: var(--fg-dim); }

  /* Backlinks block */
  .backlinks-block {
    margin-top: 24px;
    border-top: 1px dashed var(--rule);
    padding-top: 12px;
    font-size: 12px;
    color: var(--fg-dim);
  }
  .backlinks-block h4 {
    margin: 0 0 6px;
    color: var(--fg-dim);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 10px;
  }

  /* Misc small */
  .kbd {
    display: inline-block;
    border: 1px solid var(--rule);
    padding: 0 4px;
    color: var(--fg-dim);
    font-size: 11px;
    background: var(--bg-1);
  }

  /* Cursor blink for editor heading */
  .blink {
    animation: blink 1.1s steps(2, start) infinite;
    color: var(--accent);
  }
  @keyframes blink { to { visibility: hidden; } }

  /* Section dividers via box-drawing chars */
  .rule-h {
    color: var(--fg-mute);
    white-space: pre;
    overflow: hidden;
    line-height: 1.0;
    margin: 6px 0;
    font-size: 11px;
  }

  /* Cmd palette overlay (closed by default) */
  .cmdpal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 14vh;
  }
  .cmdpal {
    width: 560px;
    background: var(--bg);
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 1px var(--bg-1), 0 0 30px rgba(255,176,0,0.18);
  }
  .cmdpal-head {
    border-bottom: 1px solid var(--rule);
    padding: 8px 12px;
    color: var(--fg-dim);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .cmdpal-head input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--fg);
    font: inherit;
    outline: none;
  }
  .cmdpal-list { max-height: 320px; overflow: auto; }
  .cmdpal-row {
    padding: 5px 12px;
    display: flex;
    gap: 10px;
    color: var(--fg-dim);
    cursor: default;
  }
  .cmdpal-row.active { background: var(--sel); color: var(--accent); }
  .cmdpal-row .kind { color: var(--fg-mute); width: 80px; }

  /* Paper-mode tweaks: round things off slightly */
  body.theme-paper .winbtn,
  body.theme-paper .winbtn.x { border-radius: 50%; }
  body.theme-paper .ascii-header { font-family: "VT323", monospace; }

  /* Disable CRT FX on non-terminal themes */
  body.theme-karpathy.scanlines::before,
  body.theme-karpathy.scanlines::after,
  body.theme-obsidian.scanlines::before,
  body.theme-obsidian.scanlines::after,
  body.theme-swiss.scanlines::before,
  body.theme-swiss.scanlines::after { display: none; }
  body.theme-karpathy.crt-glow *,
  body.theme-obsidian.crt-glow *,
  body.theme-swiss.crt-glow * { text-shadow: none; }
</style>
