<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CBOSA — Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=VT323&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<script>
  // Persisted defaults — edited by host when user toggles tweaks
  window.__TWEAK_DEFAULTS__ = /*EDITMODE-BEGIN*/{
    "theme": "phosphor",
    "fontFamily": "JetBrains Mono",
    "fontSize": 13,
    "scanlines": true,
    "crtGlow": true,
    "asciiHeader": true,
    "dither": false,
    "artSlots": true,
    "density": "compact"
  }/*EDITMODE-END*/;
</script>

<style>
  :root {
    /* Phosphor Green (default) */
    --bg: #000000;
    --bg-1: #050a06;
    --bg-2: #0a140c;
    --fg: #33ff66;
    --fg-dim: #1a8033;
    --fg-mute: #0e4d1d;
    --accent: #ffb000;
    --accent-dim: #805800;
    --rule: #1a3a22;
    --sel: rgba(51, 255, 102, 0.14);
    --hot: #ff4d4d;
    --glow: 0 0 6px rgba(51, 255, 102, 0.45);
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  * { box-sizing: border-box; }

  /* App shell */
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* CRT glow on text */
  body.crt-glow, body.crt-glow * {
    text-shadow: 0 0 1px currentColor, 0 0 8px rgba(51,255,102,0.20);
  }
  body.crt-glow.theme-amber, body.crt-glow.theme-amber * {
    text-shadow: 0 0 1px currentColor, 0 0 8px rgba(255,176,0,0.22);
  }
  body.crt-glow.theme-blue, body.crt-glow.theme-blue * {
    text-shadow: 0 0 1px currentColor, 0 0 8px rgba(107,193,255,0.22);
  }
  body.crt-glow.theme-paper, body.crt-glow.theme-paper * {
    text-shadow: none;
  }

  /* Scanlines overlay */
  body.scanlines::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9000;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.22) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: multiply;
  }
  body.scanlines::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9001;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%);
  }
  body.theme-paper.scanlines::before { opacity: 0.35; }
  body.theme-paper.scanlines::after { opacity: 0.25; }

  /* Dither pattern */
  body.dither #app {
    background-image:
      radial-gradient(rgba(51,255,102,0.05) 1px, transparent 1px),
      radial-gradient(rgba(51,255,102,0.03) 1px, transparent 1px);
    background-size: 4px 4px, 8px 8px;
    background-position: 0 0, 2px 2px;
  }
  body.theme-amber.dither #app {
    background-image:
      radial-gradient(rgba(255,176,0,0.06) 1px, transparent 1px),
      radial-gradient(rgba(255,176,0,0.03) 1px, transparent 1px);
  }
  body.theme-blue.dither #app {
    background-image:
      radial-gradient(rgba(107,193,255,0.06) 1px, transparent 1px),
      radial-gradient(rgba(107,193,255,0.03) 1px, transparent 1px);
  }
  body.theme-paper.dither #app {
    background-image:
      radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
  }

  /* Themes */
  body.theme-phosphor {
    --bg: #000000;
    --bg-1: #050a06;
    --bg-2: #0a140c;
    --fg: #33ff66;
    --fg-dim: #1a8033;
    --fg-mute: #0e4d1d;
    --accent: #ffb000;
    --accent-dim: #805800;
    --rule: #1a3a22;
    --sel: rgba(51, 255, 102, 0.14);
  }
  body.theme-amber {
    --bg: #0a0500;
    --bg-1: #100800;
    --bg-2: #1a0e00;
    --fg: #ffb000;
    --fg-dim: #805800;
    --fg-mute: #3d2900;
    --accent: #ff5500;
    --accent-dim: #802b00;
    --rule: #3d2900;
    --sel: rgba(255,176,0,0.14);
  }
  body.theme-blue {
    --bg: #00131f;
    --bg-1: #001a2b;
    --bg-2: #002238;
    --fg: #6bc1ff;
    --fg-dim: #3a7ab3;
    --fg-mute: #1f4566;
    --accent: #ffffff;
    --accent-dim: #b3b3b3;
    --rule: #1f4566;
    --sel: rgba(107,193,255,0.14);
  }
  body.theme-paper {
    --bg: #f5f1e8;
    --bg-1: #efeadc;
    --bg-2: #e8e2d2;
    --fg: #1a1a1a;
    --fg-dim: #555;
    --fg-mute: #8a8a8a;
    --accent: #b3361b;
    --accent-dim: #8a2614;
    --rule: #c8c2b3;
    --sel: rgba(179,54,27,0.10);
  }

  /* — Karpathy Paper Wiki — academic, off-white, blue links */
  body.theme-karpathy {
    --bg: #fdfaf0;
    --bg-1: #f6f1de;
    --bg-2: #ede5c8;
    --fg: #1a1a1a;
    --fg-dim: #4a4a4a;
    --fg-mute: #888;
    --accent: #0033cc;
    --accent-dim: #002388;
    --rule: #d8cfa8;
    --sel: rgba(0,51,204,0.10);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  body.theme-karpathy { font-family: "IBM Plex Mono", ui-monospace, monospace !important; }
  body.theme-karpathy .editor h1,
  body.theme-karpathy .editor h2,
  body.theme-karpathy .editor h3 {
    font-family: "Lora", Georgia, serif;
    font-weight: 600;
    color: #1a1a1a;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 4px;
  }
  body.theme-karpathy .editor h1::before,
  body.theme-karpathy .editor h2::before,
  body.theme-karpathy .editor h3::before { content: none; }
  body.theme-karpathy .ascii-header { font-family: "Lora", Georgia, serif; font-size: 18px; font-style: italic; letter-spacing: 0.02em; }
  body.theme-karpathy .wikilink { text-decoration-style: solid; }
  body.theme-karpathy .panel-head { background: var(--bg-1); }
  body.theme-karpathy .winchrome { background: var(--bg-1); }
  body.theme-karpathy .editor { font-size: 14px; }

  /* — Obsidian Dark — soft purples + blues, rounded */
  body.theme-obsidian {
    --bg: #1e1e2e;
    --bg-1: #232336;
    --bg-2: #2a2a40;
    --fg: #cdd6f4;
    --fg-dim: #8b91b0;
    --fg-mute: #585b70;
    --accent: #cba6f7;
    --accent-dim: #7a5fb8;
    --rule: #383850;
    --sel: rgba(203,166,247,0.14);
    font-family: "Inter", system-ui, sans-serif;
  }
  body.theme-obsidian { font-family: "Inter", system-ui, sans-serif !important; }
  body.theme-obsidian .editor h1,
  body.theme-obsidian .editor h2,
  body.theme-obsidian .editor h3 {
    color: var(--accent);
    font-weight: 600;
  }
  body.theme-obsidian .editor h1::before { content: "# "; color: #89b4fa; }
  body.theme-obsidian .editor h2::before { content: "## "; color: #89b4fa; }
  body.theme-obsidian .editor h3::before { content: "### "; color: #89b4fa; }
  body.theme-obsidian .panel,
  body.theme-obsidian .panel-head { background: var(--bg-1); }
  body.theme-obsidian .input,
  body.theme-obsidian .chip { border-radius: 6px; }
  body.theme-obsidian .winbtn { border-radius: 50%; }
  body.theme-obsidian .ascii-header { font-family: "JetBrains Mono", monospace; color: #89b4fa; }
  body.theme-obsidian .editor code { background: var(--bg-2); border-radius: 4px; font-family: "JetBrains Mono", monospace; }
  body.theme-obsidian .wikilink { color: #89b4fa; text-decoration-style: solid; }
  body.theme-obsidian .editor { font-size: 14px; line-height: 1.6; }
  body.theme-obsidian .frontmatter { border-radius: 6px; font-family: "JetBrains Mono", monospace; font-size: 12px; }

  /* — Brutalist Swiss — pure white, hard borders, big numbers, Helvetica */
  body.theme-swiss {
    --bg: #ffffff;
    --bg-1: #f4f4f4;
    --bg-2: #e8e8e8;
    --fg: #000000;
    --fg-dim: #333;
    --fg-mute: #888;
    --accent: #ff0033;
    --accent-dim: #cc0022;
    --rule: #000000;
    --sel: rgba(255,0,51,0.10);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body.theme-swiss { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif !important; }
  body.theme-swiss .winchrome,
  body.theme-swiss .menubar,
  body.theme-swiss .panel-head,
  body.theme-swiss .panel,
  body.theme-swiss .statusbar,
  body.theme-swiss .editor-bar { border-color: #000 !important; }
  body.theme-swiss .panel-head { border-bottom-width: 2px; background: var(--bg); text-transform: uppercase; font-weight: 700; }
  body.theme-swiss .winchrome { border-bottom-width: 2px; }
  body.theme-swiss .statusbar { border-top-width: 2px; }
  body.theme-swiss .menubar { border-bottom-width: 2px; }
  body.theme-swiss .editor-bar { border-bottom-width: 2px; }
  body.theme-swiss .workspace > .panel { border-right-width: 2px; }
  body.theme-swiss .stack > .panel + .panel { border-top-width: 2px; }
  body.theme-swiss .editor h1,
  body.theme-swiss .editor h2,
  body.theme-swiss .editor h3 {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #000;
  }
  body.theme-swiss .editor h1 { font-size: 2.2em; line-height: 1.0; margin: 22px 0 12px; }
  body.theme-swiss .editor h1::before,
  body.theme-swiss .editor h2::before,
  body.theme-swiss .editor h3::before { content: none; }
  body.theme-swiss .ascii-header { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.04em; text-align: left; padding-left: 8px; }
  body.theme-swiss .chip { border-radius: 0; border-width: 1.5px; }
  body.theme-swiss .input { border-radius: 0; border-width: 1.5px; }
  body.theme-swiss .winbtn { border-radius: 0; border-width: 1.5px; }
  body.theme-swiss .wikilink { color: var(--accent); text-decoration-style: solid; }
  body.theme-swiss .bar-fill { box-shadow: none; }
  body.theme-swiss .editor { font-size: 14px; }
  body.theme-swiss .editor code { background: #f4f4f4; border-radius: 0; border-color: #000; }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--fg-mute); }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }

  ::selection { background: var(--sel); color: var(--accent); }

  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { color: var(--fg); }

  hr.row { border: none; border-top: 1px dashed var(--rule); margin: 6px 0; }

  /* Density */
  body.density-compact { font-size: 12px; line-height: 1.35; }
  body.density-comfy  { font-size: 14px; line-height: 1.55; }

  /* Generic utility classes */
  .dim { color: var(--fg-dim); }
  .mute { color: var(--fg-mute); }
  .acc { color: var(--accent); }
  .hot { color: var(--hot); }
  .nowrap { white-space: nowrap; }
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .gap-1 { gap: 4px; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .grow { flex: 1; min-width: 0; min-height: 0; }

  /* Window chrome (app frame mocked as Qt-ish) */
  .winchrome {
    height: 32px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 8px;
    background: var(--bg-1);
    flex: 0 0 32px;
    font-size: 12px;
  }
  .winbtns { display: flex; gap: 6px; padding-right: 4px; }
  .winbtn {
    width: 12px; height: 12px;
    border: 1px solid var(--fg-dim);
    border-radius: 0;
    display: inline-block;
  }
  .winbtn.x { border-color: var(--hot); }
  .wintitle { color: var(--fg-dim); letter-spacing: 0.05em; }
  .wintitle b { color: var(--fg); font-weight: 600; }

  .menubar {
    height: 26px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    display: flex;
    align-items: center;
    padding: 0 6px;
    gap: 2px;
    flex: 0 0 26px;
    font-size: 12px;
  }
  .menu {
    padding: 2px 8px;
    cursor: default;
    color: var(--fg-dim);
  }
  .menu:hover { color: var(--fg); background: var(--sel); }
  .menu.active { color: var(--fg); background: var(--sel); }

  .menubar .right {
    margin-left: auto;
    display: flex;
    gap: 12px;
    color: var(--fg-dim);
    padding-right: 6px;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .menubar .right b { color: var(--accent); font-weight: 500; }

  /* Workspace grid */
  .workspace {
    display: grid;
    grid-template-columns: 280px 1fr 340px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .workspace.density-compact { grid-template-columns: 240px 1fr 300px; }

  /* Panel chrome (box-drawing characters via CSS) */
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--rule);
    background: var(--bg);
  }
  .panel:last-child { border-right: none; }
  .panel.stack { border-right: 1px solid var(--rule); }
  .panel-head {
    display: flex;
    align-items: center;
    height: 24px;
    flex: 0 0 24px;
    padding: 0 8px;
    border-bottom: 1px solid var(--rule);
    font-size: 11px;
    color: var(--fg-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--bg-1);
    user-select: none;
  }
  .panel-head .tab {
    margin-right: 12px;
    color: var(--fg-dim);
    cursor: default;
    padding: 0 0 0 0;
    position: relative;
  }
  .panel-head .tab.active {
    color: var(--fg);
  }
  .panel-head .tab.active::before {
    content: "▌";
    color: var(--accent);
    margin-right: 4px;
  }
  .panel-head .glyph {
    color: var(--accent);
    margin-right: 6px;
  }
  .panel-head .ctrl {
    margin-left: auto;
    display: flex;
    gap: 4px;
    color: var(--fg-dim);
  }
  .panel-head .ctrl span {
    padding: 0 4px;
    cursor: default;
  }
  .panel-head .ctrl span:hover { color: var(--fg); background: var(--sel); }

  .panel-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 6px 8px;
  }

  /* Right column splits */
  .stack { display: flex; flex-direction: column; min-height: 0; }
  .stack > .panel + .panel { border-top: 1px solid var(--rule); }

  /* Status bar */
  .statusbar {
    height: 22px;
    flex: 0 0 22px;
    border-top: 1px solid var(--rule);
    background: var(--bg-1);
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-size: 11px;
    color: var(--fg-dim);
    gap: 16px;
    letter-spacing: 0.04em;
  }
  .statusbar .sep { color: var(--fg-mute); }
  .statusbar .right { margin-left: auto; display: flex; gap: 14px; }
  .statusbar b { color: var(--fg); font-weight: 500; }
  .statusbar .acc { color: var(--accent); }

  /* Tree (note browser) */
  .tree { font-size: inherit; line-height: 1.55; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
    cursor: default;
    white-space: nowrap;
    color: var(--fg);
  }
  .tree-row:hover { background: var(--sel); }
  .tree-row.active { background: var(--sel); color: var(--accent); }
  .tree-row .glyph { color: var(--fg-dim); width: 14px; display: inline-block; text-align: center; }
  .tree-row.folder > .glyph { color: var(--accent); }
  .tree-row .name { overflow: hidden; text-overflow: ellipsis; }
  .tree-indent { display: inline-block; width: 14px; }

  /* Form / inputs */
  .input {
    width: 100%;
    background: var(--bg-1);
    border: 1px solid var(--rule);
    color: var(--fg);
    font: inherit;
    padding: 3px 6px;
    outline: none;
  }
  .input:focus { border-color: var(--fg-dim); background: var(--bg-2); }
  .input::placeholder { color: var(--fg-mute); }

  .chip {
    display: inline-block;
    padding: 0 6px;
    border: 1px solid var(--rule);
    color: var(--fg-dim);
    margin: 2px 4px 2px 0;
    cursor: default;
    font-size: 11px;
    user-select: none;
  }
  .chip:hover { color: var(--fg); border-color: var(--fg-dim); }
  .chip.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--sel);
  }
  .chip .ct { color: var(--fg-mute); margin-left: 4px; }

  /* Editor */
  .editor {
    padding: 14px 32px;
    max-width: 900px;
    margin: 0 auto;
    color: var(--fg);
    font-size: inherit;
  }
  .editor h1, .editor h2, .editor h3 {
    color: var(--fg);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 18px 0 8px;
    font-family: inherit;
  }
  .editor h1 { font-size: 1.5em; }
  .editor h1::before {
    content: "# ";
    color: var(--accent);
  }
  .editor h2 { font-size: 1.2em; }
  .editor h2::before {
    content: "## ";
    color: var(--accent);
  }
  .editor h3 { font-size: 1.05em; }
  .editor h3::before {
    content: "### ";
    color: var(--accent);
  }
  .editor p { margin: 8px 0; }
  .editor ul { margin: 6px 0; padding-left: 22px; }
  .editor li { margin: 3px 0; }
  .editor ul li::marker { color: var(--accent); content: "› "; }
  .editor code {
    background: var(--bg-1);
    border: 1px solid var(--rule);
    padding: 0 4px;
    color: var(--accent);
  }
  .editor blockquote {
    margin: 8px 0;
    padding: 4px 0 4px 12px;
    border-left: 2px solid var(--accent);
    color: var(--fg-dim);
  }
  .wikilink {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    text-decoration-style: dashed;
  }
  .wikilink:hover { color: var(--fg); background: var(--sel); }
  .wikilink.broken { color: var(--hot); text-decoration-style: dotted; }
  .frontmatter {
    color: var(--fg-dim);
    border: 1px dashed var(--rule);
    padding: 6px 10px;
    margin-bottom: 12px;
    font-size: 0.95em;
    background: var(--bg-1);
  }
  .frontmatter .k { color: var(--accent); }
  .frontmatter .delim {
    color: var(--fg-mute);
    display: block;
    margin: -2px 0 4px;
  }

  /* Editor toolbar */
  .editor-bar {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--rule);
    height: 28px;
    flex: 0 0 28px;
    padding: 0 12px;
    gap: 12px;
    font-size: 11px;
    color: var(--fg-dim);
    background: var(--bg);
  }
  .editor-bar .crumb { color: var(--fg-dim); }
  .editor-bar .crumb b { color: var(--fg); font-weight: 500; }
  .editor-bar .crumb .sep { color: var(--fg-mute); margin: 0 6px; }
  .editor-bar .right { margin-left: auto; display: flex; gap: 12px; }
  .editor-bar .tog { color: var(--fg-dim); cursor: default; }
  .editor-bar .tog.on { color: var(--accent); }
  .editor-bar .tog:hover { color: var(--fg); }

  /* Tasks */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 2px 0;
    cursor: default;
  }
  .task:hover { background: var(--sel); }
  .task .box { color: var(--fg-dim); width: 16px; flex-shrink: 0; }
  .task.done .box { color: var(--accent); }
  .task.done .label { color: var(--fg-dim); text-decoration: line-through; }
  .task .meta { margin-left: auto; color: var(--fg-mute); font-size: 11px; padding-left: 8px; }
  .task .tag { color: var(--accent); }

  /* Email list */
  .mail {
    display: grid;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

// panels.jsx — all dockable panel components for the CBOSA mockup

const { useState, useMemo, useRef, useEffect } = React;

// ──────────────────────────────────────────────────────────
// Panel wrapper
// ──────────────────────────────────────────────────────────
function Panel({ title, glyph, tabs, activeTab, onTabChange, tools, children, style }) {
  return (
    <div className="panel" style={style}>
      <div className="panel-head">
        {glyph ? <span className="glyph">{glyph}</span> : null}
        {tabs ? (
          tabs.map((t, i) => (
            <span
              key={t}
              className={"tab" + (i === activeTab ? " active" : "")}
              onClick={() => onTabChange && onTabChange(i)}
            >
              {t}
            </span>
          ))
        ) : (
          <span style={{ color: "var(--fg)" }}>{title}</span>
        )}
        <span className="ctrl">
          {(tools || ["─", "□", "×"]).map((t, i) => (
            <span key={i}>{t}</span>
          ))}
        </span>
      </div>
      <div className="panel-body">{children}</div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// Note Browser — folder tree + tags + search
// ──────────────────────────────────────────────────────────
function NoteBrowser({ notes, currentNote, onSelect, tagFilter, onTagFilter, query, onQuery }) {
  const folders = useMemo(() => {
    const map = {};
    notes.forEach(n => {
      if (!map[n.folder]) map[n.folder] = [];
      map[n.folder].push(n);
    });
    FOLDER_ORDER.forEach(f => map[f] && map[f].sort((a, b) => a.title.localeCompare(b.title)));
    return map;
  }, [notes]);

  const tags = useMemo(() => deriveTags(notes), [notes]);

  const filtered = useMemo(() => {
    let xs = notes;
    if (tagFilter) xs = xs.filter(n => n.tags.includes(tagFilter));
    if (query) {
      const q = query.toLowerCase();
      xs = xs.filter(n =>
        n.title.toLowerCase().includes(q) ||
        n.content.toLowerCase().includes(q) ||
        n.tags.join(" ").includes(q)
      );
    }
    return new Set(xs.map(n => n.name));
  }, [notes, tagFilter, query]);

  const folderGlyph = "▾";
  const noteGlyph = "·";

  return (
    <>
      <input
        className="input"
        placeholder="search notes  Ctrl+P"
        value={query}
        onChange={e => onQuery(e.target.value)}
        style={{ marginBottom: 6 }}
      />

      <div className="rule-h">{"┄".repeat(50)}</div>
      <div style={{ fontSize: 10, letterSpacing: "0.08em", color: "var(--fg-mute)", textTransform: "uppercase", margin: "6px 0 4px" }}>
        tags
      </div>
      <div style={{ marginBottom: 6 }}>
        <span
          className={"chip" + (!tagFilter ? " active" : "")}
          onClick={() => onTagFilter(null)}
        >
          all<span className="ct">{notes.length}</span>
        </span>
        {tags.map(([t, c]) => (
          <span
            key={t}
            className={"chip" + (tagFilter === t ? " active" : "")}
            onClick={() => onTagFilter(tagFilter === t ? null : t)}
          >
            #{t}<span className="ct">{c}</span>
          </span>
        ))}
      </div>

      <div className="rule-h">{"┄".repeat(50)}</div>
      <div style={{ fontSize: 10, letterSpacing: "0.08em", color: "var(--fg-mute)", textTransform: "uppercase", margin: "6px 0 4px" }}>
        notes/
      </div>

      <div className="tree">
        {FOLDER_ORDER.map(folder => {
          const items = (folders[folder] || []).filter(n => filtered.has(n.name));
          if (!items.length && (tagFilter || query)) return null;
          return (
            <div key={folder}>
              <div className="tree-row folder">
                <span className="glyph">{folderGlyph}</span>
                <span className="name">{folder}/</span>
                <span style={{ marginLeft: "auto", color: "var(--fg-mute)", fontSize: 11 }}>{(folders[folder] || []).length}</span>
              </div>
              {items.map(n => (
                <div
                  key={n.name}
                  className={"tree-row" + (currentNote === n.name ? " active" : "")}
                  onClick={() => onSelect(n.name)}
                >
                  <span className="tree-indent" />
                  <span className="glyph">{noteGlyph}</span>
                  <span className="name">{n.title}</span>
                </div>
              ))}
            </div>
          );
        })}
      </div>

      <div className="rule-h" style={{ marginTop: 12 }}>{"┄".repeat(50)}</div>
      <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
        <span className="chip" style={{ flex: 1, textAlign: "center" }}>+ new note</span>
        <span className="chip" style={{ flex: 1, textAlign: "center" }}>+ daily</span>
      </div>
    </>
  );
}

// ──────────────────────────────────────────────────────────
// Markdown renderer (lightweight, in-page)
// ──────────────────────────────────────────────────────────
function renderMarkdown(src, knownNoteNames, onLinkClick) {
  // Split into front-matter + body
  let body = src;
  let fm = null;
  const fmMatch = src.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if (fmMatch) {
    fm = fmMatch[1];
    body = fmMatch[2];
  }

  const lines = body.split("\n");
  const out = [];
  let i = 0;
  let key = 0;
  const k = () => "k" + (key++);

  const inline = (text) => {
    // wikilinks
    const parts = [];
    const re = /\[\[([^\]]+)\]\]|\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`/g;
    let lastIdx = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > lastIdx) parts.push(text.slice(lastIdx, m.index));
      if (m[1]) {
        const target = m[1].trim();
        const known = knownNoteNames.has(target) || [...knownNoteNames].some(n => n.toLowerCase() === target.toLowerCase());
        parts.push(
          <span
            key={k()}
            className={"wikilink" + (known ? "" : " broken")}
            onClick={() => onLinkClick && onLinkClick(target)}
            title={known ? `open ${target}` : `unresolved: ${target}`}
          >
            {target}
          </span>
        );
      } else if (m[2]) {
        parts.push(<b key={k()}>{m[2]}</b>);
      } else if (m[3]) {
        parts.push(<i key={k()}>{m[3]}</i>);
      } else if (m[4]) {
        parts.push(<code key={k()}>{m[4]}</code>);
      }
      lastIdx = m.index + m[0].length;
    }
    if (lastIdx < text.length) parts.push(text.slice(lastIdx));
    // Also colorize #tags
    return parts.flatMap((p, idx) => {
      if (typeof p !== "string") return [p];
      const subs = [];
      const tre = /#[a-z0-9_-]+/gi;
      let li = 0, mm;
      while ((mm = tre.exec(p)) !== null) {
        if (mm.index > li) subs.push(p.slice(li, mm.index));
        subs.push(<span key={k()} style={{ color: "var(--accent)" }}>{mm[0]}</span>);
        li = mm.index + mm[0].length;
      }
      if (li < p.length) subs.push(p.slice(li));
      return subs.length ? subs : [p];
    });
  };

  while (i < lines.length) {
    const line = lines[i];

    if (/^#\s/.test(line)) { out.push(<h1 key={k()}>{inline(line.replace(/^#\s/, ""))}</h1>); i++; continue; }
    if (/^##\s/.test(line)) { out.push(<h2 key={k()}>{inline(line.replace(/^##\s/, ""))}</h2>); i++; continue; }
    if (/^###\s/.test(line)) { out.push(<h3 key={k()}>{inline(line.replace(/^###\s/, ""))}</h3>); i++; continue; }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      out.push(<blockquote key={k()}>{buf.map((b, j) => <div key={j}>{inline(b)}</div>)}</blockquote>);
      continue;
    }
    if (/^[-*]\s\[[ x]\]\s/.test(line)) {
      const buf = [];
      while (i < lines.length && /^[-*]\s\[[ x]\]\s/.test(lines[i])) {
        const m = lines[i].match(/^[-*]\s\[([ x])\]\s(.*)$/);
        buf.push({ done: m[1] === "x", text: m[2] });
        i++;
      }
      out.push(
        <ul key={k()} style={{ listStyle: "none", paddingLeft: 4 }}>
          {buf.map((b, j) => (
            <li key={j} style={{ color: b.done ? "var(--fg-dim)" : "var(--fg)", textDecoration: b.done ? "line-through" : "none" }}>
              <span style={{ color: "var(--accent)", marginRight: 6 }}>{b.done ? "[x]" : "[ ]"}</span>
              {inline(b.text)}
            </li>
          ))}
        </ul>
      );
      continue;
    }
    if (/^[-*]\s/.test(line)) {
      const buf = [];
      while (i < lines.length && /^[-*]\s/.test(lines[i]) && !/^[-*]\s\[[ x]\]\s/.test(lines[i])) {
        buf.push(lines[i].replace(/^[-*]\s/, ""));
        i++;
      }
      out.push(<ul key={k()}>{buf.map((b, j) => <li key={j}>{inline(b)}</li>)}</ul>);
      continue;
    }
    if (line.startsWith("|")) {
      // table
      const buf = [];
      while (i < lines.length && lines[i].startsWith("|")) {
        buf.push(lines[i]);
        i++;
      }
      const rows = buf.filter(l => !/^\|\s*[-:|\s]+\|$/.test(l)).map(l =>
        l.split("|").slice(1, -1).map(c => c.trim())
      );
      out.push(
        <table key={k()} style={{ borderCollapse: "collapse", margin: "8px 0", fontSize: "0.95em" }}>
          <tbody>
            {rows.map((r, ri) => (
              <tr key={ri}>
                {r.map((c, ci) => (
                  ri === 0
                    ? <th key={ci} style={{ borderBottom: "1px solid var(--rule)", padding: "2px 12px 2px 0", textAlign: "left", color: "var(--accent)", fontWeight: 500 }}>{c}</th>
                    : <td key={ci} style={{ padding: "2px 12px 2px 0", color: "var(--fg)" }}>{c}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      );
      continue;
    }
    if (line.trim() === "") { out.push(<div key={k()} style={{ height: 6 }} />); i++; continue; }
    out.push(<p key={k()}>{inline(line)}</p>);
    i++;
  }

  return { fm, body: out };
}

// ──────────────────────────────────────────────────────────
// Note Editor + Backlinks
// ──────────────────────────────────────────────────────────
function NoteEditor({ note, allNotes, backlinks, onOpenNote, artSlots }) {
  if (!note) return <div style={{ padding: 24, color: "var(--fg-mute)" }}>no note open. press <span className="kbd">Ctrl+P</span> or pick one from the browser.</div>;

  const knownNames = useMemo(() => {
    const s = new Set();
    allNotes.forEach(n => { s.add(n.name); s.add(n.title); });
    return s;
  }, [allNotes]);

  const { fm, body } = renderMarkdown(note.content, knownNames, (target) => {
    // resolve case-insensitive by name OR title
    const hit = allNotes.find(n => n.name.toLowerCase() === target.toLowerCase() || n.title.toLowerCase() === target.toLowerCase());
    if (hit) onOpenNote(hit.name);
  });

  const refs = backlinks[note.name] || backlinks[note.title] || new Set();

  return (
    <div className="editor">
      {fm && (
        <div className="frontmatter">
          <span className="delim">---</span>
          {fm.split("\n").map((l, i) => {
            const m = l.match(/^([a-z_]+):\s*(.*)$/i);
            if (!m) return <div key={i}>{l}</div>;
            return <div key={i}><span className="k">{m[1]}</span>: {m[2]}</div>;
          })}
          <span className="delim">---</span>
        </div>
      )}
      {body}

      {artSlots && (
        <div className="artslot">
          [ banner art slot — drop your image / svg here ]
        </div>
      )}

      <div className="backlinks-block">
        <h4>backlinks · {[...refs].length}</h4>
        {[...refs].length === 0 ? (
          <div style={{ color: "var(--fg-mute)" }}>no notes link here yet.</div>
        ) : (
          [...refs].map(n => {
            const src = allNotes.find(x => x.name === n);
            return (
              <div key={n} style={{ marginBottom: 4 }}>
                <span className="wikilink" onClick={() => onOpenNote(n)}>{src ? src.title : n}</span>
                <span style={{ color: "var(--fg-mute)", marginLeft: 8, fontSize: 11 }}>{src && src.folder + "/"}</span>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// Tasks panel
// ──────────────────────────────────────────────────────────
function Tasks({ tasks, onToggle }) {
  const open = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done);
  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ color: "var(--fg-dim)", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase" }}>
          open · {open.length}
        </span>
        <span style={{ color: "var(--fg-mute)", fontSize: 11 }}>
          {done.length}/{tasks.length} done
        </span>
      </div>
      {open.map(t => (
        <div key={t.id} className="task" onClick={() => onToggle(t.id)}>
          <span className="box">[ ]</span>
          <span className="label">
            {t.text} <span className="tag">#{t.tag}</span>
          </span>
          <span className="meta">{t.due}</span>
        </div>
      ))}
      {done.length > 0 && (
        <>
          <div className="rule-h" style={{ marginTop: 10 }}>{"┄".repeat(40)}</div>
          <div style={{ color: "var(--fg-mute)", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase", margin: "6px 0 4px" }}>
            done
          </div>
          {done.map(t => (
            <div key={t.id} className="task done" onClick={() => onToggle(t.id)}>
              <span className="box">[x]</span>
              <span className="label">{t.text}</span>
            </div>
          ))}
        </>
      )}
    </>
  );
}

// ──────────────────────────────────────────────────────────
// Finance panel — ASCII-ish bars + sparkline
// ──────────────────────────────────────────────────────────
function Finance({ data, artSlots }) {
  const max = Math.max(...data.cats.map(c => c.amt));
  const sparkChars = ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"];
  const wmax = Math.max(...data.weekly);
  const spark = data.weekly.map(w => sparkChars[Math.min(7, Math.floor((w / wmax) * 7))]).join("");

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
        <span style={{ color: "var(--fg-dim)", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase" }}>
          ledger · {data.monthLabel}
        </span>
        <span style={{ color: "var(--fg-mute)", fontSize: 11 }}>net ${(data.income - data.spent).toFixed(2)}</span>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, margin: "6px 0 8px" }}>
        <div>
          <div style={{ color: "var(--fg-mute)", fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase" }}>out</div>
          <div style={{ color: "var(--accent)", fontSize: 18, lineHeight: 1.1 }}>${data.spent.toFixed(2)}</div>
        </div>
        <div>
          <div style={{ color: "var(--fg-mute)", fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase" }}>in</div>
          <div style={{ color: "var(--fg)", fontSize: 18, lineHeight: 1.1 }}>${data.income.toFixed(2)}</div>
        </div>
      </div>

      <div className="spark" title="weekly spend, last 14 wks">{spark}</div>
      <div style={{ color: "var(--fg-mute)", fontSize: 10, marginBottom: 8, letterSpacing: "0.05em" }}>
        14 wks ←———→ now
      </div>

      <div className="barchart">
        {data.cats.map(c => {
          const w = (c.amt / max) * 100;
          return (
            <div className="bar-row" key={c.cat}>
              <span className="cat">{c.cat}</span>
              <div className="bar-track">
                <div className="bar-fill" style={{ width: w + "%" }} />
              </div>
              <span className="amt">${c.amt.toFixed(2)}</span>
            </div>
          );
        })}
      </div>

      {artSlots && (
        <div className="artslot" style={{ padding: "10px 8px", marginTop: 8 }}>
          [ icon for finance panel ]
        </div>
      )}
    </>
  );
}

// ──────────────────────────────────────────────────────────
// Email intake panel
// ──────────────────────────────────────────────────────────
function Email({ emails }) {
  const unread = emails.filter(e => !e.read).length;
  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ color: "var(--fg-dim)", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase" }}>
          inbox · imap
        </span>
        <span style={{ color: "var(--accent)", fontSize: 11 }}>● {unread} new</span>
      </div>

      {emails.map(e => (
        <div key={e.id} className={"mail" + (e.read ? " read" : "")}>
          <span className="pip">●</span>
          <div className="col" style={{ minWidth: 0 }}>
            <span className="from">{e.from}</span>
            <span className="subj">{e.subj}</span>
            {e.action && <span className="action">{e.action}</span>}
          </div>
          <span className="when">{e.when}</span>
        </div>
      ))}
    </>
  );
}

// ──────────────────────────────────────────────────────────
// Canvas-style assignment list (compact)
// ──────────────────────────────────────────────────────────
function CanvasList({ items }) {
  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ color: "var(--fg-dim)", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase" }}>
          canvas lms
        </span>
        <span style={{ color: "var(--fg-mute)", fontSize: 11 }}>sync 4m ago</span>
      </div>
      {items.map((it, i) => (
        <div key={i} style={{ display: "grid", gridTemplateColumns: "60px 1fr auto", gap: 6, padding: "3px 0", borderBottom: "1px dashed var(--rule)", fontSize: 12 }}>
          <span style={{ color: "var(--accent)" }}>{it.course}</span>
          <span style={{ color: "var(--fg)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.assign}</span>
          <span style={{ color: it.status.startsWith("grade") ? "var(--fg-dim)" : "var(--accent)", fontSize: 11 }}>{it.due === "—" ? it.status : it.due}</span>
        </div>
      ))}
    </>
  );
}

Object.assign(window, { Panel, NoteBrowser, NoteEditor, Tasks, Finance, Email, CanvasList });

</script>
  <script type="text/babel" data-source="app.jsx">
// app.jsx — top-level CBOSA window

const { useState, useMemo, useEffect } = React;

const ASCII_LOGO = `   ___ ___  ___  ___   _
  / __| _ )/ _ \\/ __| /_\\
 | (__| _ \\ (_) \\__ \\/ _ \\
  \\___|___/\\___/|___/_/ \\_\\  v0.1 · personal os`;

function App() {
  // Allow URL hash to override default theme so explorations canvas can pin a variant
  const hashTheme = (typeof window !== "undefined" && window.location.hash.match(/theme=([a-z]+)/) || [])[1];
  const defaults = hashTheme
    ? { ...window.__TWEAK_DEFAULTS__, theme: hashTheme,
        scanlines: hashTheme === "phosphor" || hashTheme === "amber" || hashTheme === "blue" || hashTheme === "paper",
        crtGlow:   hashTheme === "phosphor" || hashTheme === "amber" || hashTheme === "blue",
        asciiHeader: hashTheme !== "swiss" ? window.__TWEAK_DEFAULTS__.asciiHeader : true }
    : window.__TWEAK_DEFAULTS__;
  const [t, setTweak] = useTweaks(defaults);

  const [currentNote, setCurrentNote] = useState("2026-05-11");
  const [tagFilter, setTagFilter] = useState(null);
  const [query, setQuery] = useState("");
  const [tasks, setTasks] = useState(window.TASKS);
  const [activeMenu, setActiveMenu] = useState(null);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [cmdQuery, setCmdQuery] = useState("");
  const [cmdIdx, setCmdIdx] = useState(0);

  const backlinks = useMemo(() => deriveBacklinks(NOTES), []);
  const note = useMemo(() => NOTES.find(n => n.name === currentNote), [currentNote]);

  // Apply theme & art settings to body
  useEffect(() => {
    document.body.className = [
      "theme-" + t.theme,
      t.crtGlow ? "crt-glow" : "",
      t.scanlines ? "scanlines" : "",
      t.dither ? "dither" : "",
      "density-" + t.density,
    ].filter(Boolean).join(" ");
  }, [t.theme, t.crtGlow, t.scanlines, t.dither, t.density]);

  useEffect(() => {
    document.documentElement.style.setProperty("--app-font", `"${t.fontFamily}", "JetBrains Mono", ui-monospace, monospace`);
    document.body.style.fontFamily = `"${t.fontFamily}", "JetBrains Mono", ui-monospace, monospace`;
    document.body.style.fontSize = t.fontSize + "px";
  }, [t.fontFamily, t.fontSize]);

  // Command palette keybind
  useEffect(() => {
    const h = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "p") {
        e.preventDefault();
        setCmdOpen(true);
      } else if (e.key === "Escape") {
        setCmdOpen(false);
        setActiveMenu(null);
      }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  const toggleTask = (id) =>
    setTasks(xs => xs.map(x => x.id === id ? { ...x, done: !x.done } : x));

  const openNote = (name) => {
    const hit = NOTES.find(n => n.name === name || n.title === name);
    if (hit) {
      setCurrentNote(hit.name);
      setCmdOpen(false);
    }
  };

  // Cmd palette items: notes + panels + commands
  const cmdItems = useMemo(() => {
    const q = cmdQuery.toLowerCase();
    const noteItems = NOTES.map(n => ({ kind: "note", label: n.title, sub: n.folder + "/", action: () => openNote(n.name) }));
    const cmds = [
      { kind: "command", label: "today's daily note", action: () => openNote("2026-05-11") },
      { kind: "command", label: "switch theme: phosphor", action: () => setTweak("theme", "phosphor") },
      { kind: "command", label: "switch theme: amber", action: () => setTweak("theme", "amber") },
      { kind: "command", label: "switch theme: blue (3270)", action: () => setTweak("theme", "blue") },
      { kind: "command", label: "switch theme: paper", action: () => setTweak("theme", "paper") },
      { kind: "command", label: "toggle scanlines", action: () => setTweak("scanlines", !t.scanlines) },
      { kind: "command", label: "toggle crt glow", action: () => setTweak("crtGlow", !t.crtGlow) },
      { kind: "panel", label: "add panel: graph view" },
      { kind: "panel", label: "add panel: backlinks" },
      { kind: "panel", label: "add panel: capture" },
    ];
    const all = [...cmds, ...noteItems];
    if (!q) return all;
    return all.filter(c => c.label.toLowerCase().includes(q) || (c.sub || "").toLowerCase().includes(q));
  }, [cmdQuery, t.scanlines, t.crtGlow]);

  useEffect(() => { setCmdIdx(0); }, [cmdQuery, cmdOpen]);

  const runCmd = (item) => { if (item && item.action) item.action(); setCmdOpen(false); };

  // Apply right-column composition based on density
  const wsCols = t.density === "compact" ? "240px 1fr 300px" : t.density === "comfy" ? "300px 1fr 360px" : "280px 1fr 340px";

  return (
    <>
      {/* App window chrome */}
      <div className="winchrome">
        <div className="winbtns">
          <span className="winbtn x" />
          <span className="winbtn" />
          <span className="winbtn" />
        </div>
        <div className="wintitle">
          <b>CBOSA</b> · <span>~/cbosa/vault</span> · <span style={{ color: "var(--accent)" }}>● local</span>
        </div>
        <div style={{ marginLeft: "auto", color: "var(--fg-mute)", fontSize: 11, letterSpacing: "0.06em" }}>
          {t.theme.toUpperCase()} · {t.fontFamily.replace(/^\w/, c => c.toUpperCase())} · {t.fontSize}px
        </div>
      </div>

      {/* Menu bar */}
      <div className="menubar">
        {["File", "Edit", "View", "Workspace", "Panels", "Theme", "Help"].map(m => (
          <span
            key={m}
            className={"menu" + (activeMenu === m ? " active" : "")}
            onClick={() => setActiveMenu(activeMenu === m ? null : m)}
          >
            {m}
          </span>
        ))}
        <div className="right">
          <span>tue · <b>10:14</b></span>
          <span>cpu <b>4%</b></span>
          <span>ai: <b>null</b></span>
        </div>
      </div>

      {/* Optional ASCII header */}
      {t.asciiHeader && (
        <div style={{ padding: "8px 16px 2px", borderBottom: "1px solid var(--rule)", background: "var(--bg-1)" }}>
          <pre className="ascii-header">{ASCII_LOGO}</pre>
        </div>
      )}

      {/* Workspace */}
      <div className="workspace" style={{ gridTemplateColumns: wsCols }}>
        {/* LEFT: Note Browser */}
        <Panel glyph="[N]" tabs={["NOTE BROWSER", "GRAPH"]} activeTab={0} onTabChange={() => {}}>
          <NoteBrowser
            notes={NOTES}
            currentNote={currentNote}
            onSelect={setCurrentNote}
            tagFilter={tagFilter}
            onTagFilter={setTagFilter}
            query={query}
            onQuery={setQuery}
          />
          {t.artSlots && (
            <div className="artslot" style={{ marginTop: 8 }}>
              [ vault icon slot ]
            </div>
          )}
        </Panel>

        {/* CENTER: Note Editor */}
        <div className="panel" style={{ borderRight: "1px solid var(--rule)" }}>
          <div className="editor-bar">
            <span className="crumb">
              <span style={{ color: "var(--accent)" }}>~/cbosa/vault/</span>
              <b>{note ? note.folder + "/" + note.name + ".md" : "—"}</b>
            </span>
            <div className="right">
              <span className="tog on">[edit]</span>
              <span className="tog">[preview]</span>
              <span className="tog">[split]</span>
              <span className="mute">·</span>
              <span className="tog">⟲ saved 12s ago</span>
            </div>
          </div>
          <div className="panel-body" style={{ padding: 0 }}>
            <NoteEditor
              note={note}
              allNotes={NOTES}
              backlinks={backlinks}
              onOpenNote={openNote}
              artSlots={t.artSlots}
            />
          </div>
        </div>

        {/* RIGHT: stack of three small panels */}
        <div className="stack">
          <Panel glyph="[T]" tabs={["TASKS"]} activeTab={0} style={{ flex: "0 0 38%", minHeight: 200, borderRight: "none", borderBottom: "1px solid var(--rule)" }}>
            <Tasks tasks={tasks} onToggle={toggleTask} />
          </Panel>
          <Panel glyph="[$]" tabs={["FINANCE", "CANVAS"]} activeTab={0} style={{ flex: "0 0 34%", minHeight: 180, borderRight: "none", borderBottom: "1px solid var(--rule)" }}>
            <Finance data={FINANCE} artSlots={t.artSlots} />
            <div className="rule-h">{"┄".repeat(40)}</div>
            <CanvasList items={CANVAS} />
          </Panel>
          <Panel glyph="[@]" tabs={["EMAIL"]} activeTab={0} style={{ flex: 1, minHeight: 180, borderRight: "none" }}>
            <Email emails={EMAILS} />
          </Panel>
        </div>
      </div>

      {/* Status bar */}
      <div className="statusbar">
        <span>● <b>connected</b></span>
        <span className="sep">│</span>
        <span>vault: <b>{NOTES.length}</b> notes</span>
        <span className="sep">│</span>
        <span>tasks: <b className="acc">{tasks.filter(x => !x.done).length}</b> open</span>
        <span className="sep">│</span>
        <span>theme: <b>{t.theme}</b></span>
        <div className="right">
          <span><span className="kbd">Ctrl+P</span> palette</span>
          <span><span className="kbd">Ctrl+S</span> save</span>
          <span><span className="kbd">⌘,</span> theme.toml</span>
        </div>
      </div>

      {/* Command palette */}
      {cmdOpen && (
        <div className="cmdpal-backdrop" onClick={() => setCmdOpen(false)}>
          <div className="cmdpal" onClick={e => e.stopPropagation()}>
            <div className="cmdpal-head">
              <span style={{ color: "var(--accent)" }}>{">"}</span>
              <input
                autoFocus
                value={cmdQuery}
                onChange={e => setCmdQuery(e.target.value)}
                onKeyDown={e => {
                  if (e.key === "ArrowDown") { e.preventDefault(); setCmdIdx(i => Math.min(cmdItems.length - 1, i + 1)); }
                  else if (e.key === "ArrowUp") { e.preventDefault(); setCmdIdx(i => Math.max(0, i - 1)); }
                  else if (e.key === "Enter") { e.preventDefault(); runCmd(cmdItems[cmdIdx]); }
                }}
                placeholder="search notes, panels, commands…"
              />
              <span style={{ color: "var(--fg-mute)", fontSize: 11 }}>{cmdItems.length} hits</span>
            </div>
            <div className="cmdpal-list">
              {cmdItems.slice(0, 60).map((it, i) => (
                <div
                  key={i}
                  className={"cmdpal-row" + (i === cmdIdx ? " active" : "")}
                  onMouseEnter={() => setCmdIdx(i)}
                  onClick={() => runCmd(it)}
                >
                  <span className="kind">{it.kind}</span>
                  <span style={{ flex: 1 }}>{it.label}</span>
                  {it.sub && <span style={{ color: "var(--fg-mute)" }}>{it.sub}</span>}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Tweaks panel */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Aesthetic" />
        <TweakSelect
          label="Theme"
          value={t.theme}
          options={["phosphor", "amber", "blue", "paper", "karpathy", "obsidian", "swiss"]}
          onChange={v => setTweak("theme", v)}
        />

        <TweakSection label="Typography" />
        <TweakSelect
          label="Font"
          value={t.fontFamily}
          options={["JetBrains Mono", "IBM Plex Mono", "VT323"]}
          onChange={v => setTweak("fontFamily", v)}
        />
        <TweakSlider
          label="Size"
          value={t.fontSize}
          min={11}
          max={18}
          step={1}
          unit="px"
          onChange={v => setTweak("fontSize", v)}
        />
        <TweakRadio
          label="Density"
          value={t.density}
          options={["compact", "regular", "comfy"]}
          onChange={v => setTweak("density", v)}
        />

        <TweakSection label="CRT / Art" />
        <TweakToggle label="Scanlines"     value={t.scanlines}    onChange={v => setTweak("scanlines", v)} />
        <TweakToggle label="Phosphor glow" value={t.crtGlow}      onChange={v => setTweak("crtGlow", v)} />
        <TweakToggle label="ASCII header"  value={t.asciiHeader}  onChange={v => setTweak("asciiHeader", v)} />
        <TweakToggle label="Dither bg"     value={t.dither}       onChange={v => setTweak("dither", v)} />
        <TweakToggle label="Art slots"     value={t.artSlots}     onChange={v => setTweak("artSlots", v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);

</script>
</body>
</html>
